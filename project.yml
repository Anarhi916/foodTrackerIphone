name: NutritionTracker
options:
  bundleIdPrefix: com.nutrition
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  NutritionTracker:
    type: application
    platform: iOS
    sources:
      - NutritionTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nutrition.tracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера используется для сканирования штрих-кодов и фотографирования еды"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к фото для выбора изображений еды для анализа"
        INFOPLIST_KEY_CFBundleDisplayName: "Питание"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
